name: R CMD check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: rocker/tidyverse:4.4

    steps:
      - name: Install Node.js (required for actions/checkout)
        run: |
          apt-get update -y
          apt-get install -y nodejs

      - name: Checkout
        uses: actions/checkout@v3

      - name: Install R package dependencies
        run: |
          Rscript -e "install.packages(c('remotes', 'rcmdcheck'))"
          Rscript -e "remotes::install_deps(dependencies = TRUE)"

      - name: Check (fails on any note)
        env:
          # Dev version and new-submission notes are expected until release.
          _R_CHECK_CRAN_INCOMING_: false
          _R_CHECK_SYSTEM_CLOCK_: false
        run: |
          Rscript -e "rcmdcheck::rcmdcheck(
            args = c('--as-cran', '--no-manual'),
            error_on = 'note',
            check_dir = 'check'
          )"
